<body>
  <div class="offline" id="offlineBanner" role="status">You’re offline. Reconnect to sync campus movements.</div>
  <div id="app" aria-live="polite"></div>
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <div id="modalHost"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <script>
    (() => {
      'use strict';
      const API_URL = 'https://script.google.com/macros/s/AKfycby5dTzXk9xNvbfEoyL8w0wQcTXV1qUoIen-TkxFt5p-5ECBc3QAlQaCW3QgFIl5brmb_w/exec';
      const CAMPUS = 'Crescent SNEC';
      const SUBTITLE = 'Velimukku Campus · Movement Register';
      const CATEGORIES = ['Academic','Medical','Personal','Family','Emergency','Other'];
      const PRESETS = [30,60,120,240,480,1440];
      const PAGE_SIZE = 40;
      const NAV = {
        staff: [['overview','Overview','⌂'],['log','Log movement','↗'],['approvals','Approvals','✓'],['board','Live board','◉'],['ledger','Movement ledger','▤'],['users','People','♙'],['profile','My account','○']],
        admin: [['overview','Overview','⌂'],['log','Log movement','↗'],['approvals','Approvals','✓'],['board','Live board','◉'],['ledger','Movement ledger','▤'],['users','People','♙'],['analytics','Analytics','▥'],['profile','My account','○']],
        student: [['status','My pass','◉'],['history','My history','▤'],['profile','My account','○']],
        gatekeeper: [['gate','Gate desk','▣'],['profile','My account','○']]
      };
      const state = {
        theme: localStorage.getItem('crescent_theme') || 'light',
        token: '', user: null, view: 'login', tab: 'overview',
        movements: [], users: [], stats: {}, analytics: null,
        current: null, strikes: 0, history: [], historyStrikes: 0,
        gatePass: null, gatePassCode: '', gatePassError: '', gateScanMessage: '',
        gateLookupLoading: false, gateScanner: null, gateScannerActive: false,
        loading: false, dataLoading: false, modal: null, error: '',
        filters: { q:'', status:'All', category:'All', role:'All' },
        page: 1, callbackId: 0, refreshTimer: null, ageTimer: null, installPrompt: null
      };
      const $ = (selector, root=document) => root.querySelector(selector);
      const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));
      const app = $('#app');
      const modalHost = $('#modalHost');

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      }
      function safeClass(value) { return String(value || '').replace(/[^a-zA-Z0-9_-]/g, ''); }
      function applyTheme() {
        document.documentElement.dataset.theme = state.theme === 'dark' ? 'dark' : 'light';
        const meta = $('meta[name="theme-color"]');
        if (meta) meta.content = state.theme === 'dark' ? '#141d20' : '#244b5a';
        localStorage.setItem('crescent_theme', state.theme);
      }
      function loadSession() {
        try {
          const saved = JSON.parse(localStorage.getItem('crescent_session') || 'null');
          if (saved && saved.token && saved.user && ['student','staff','admin','gatekeeper'].includes(saved.user.role)) {
            state.token = saved.token;
            state.user = saved.user;
            state.view = 'app';
            state.tab = saved.user.role === 'student' ? 'status' : 'overview';
          }
        } catch (error) {
          console.warn('Clearing invalid saved session.', error);
          localStorage.removeItem('crescent_session');
        }
      }
      function saveSession() {
        if (state.token && state.user) localStorage.setItem('crescent_session', JSON.stringify({token:state.token,user:state.user}));
        else localStorage.removeItem('crescent_session');
      }
      function toast(message, type='') {
        const node = document.createElement('div');
        node.className = `toast${type ? ` toast-${safeClass(type)}` : ''}`;
        node.setAttribute('role', type === 'error' ? 'alert' : 'status');
        node.textContent = message;
        $('#toastWrap').appendChild(node);
        window.setTimeout(() => node.remove(), 4200);
      }
      function setOnline() { $('#offlineBanner').classList.toggle('show', !navigator.onLine); }
      function api(action, payload={}) {
        if (!navigator.onLine) return Promise.resolve({ok:false,message:'You are offline. Check your connection and try again.'});
        return new Promise(resolve => {
          const callback = `crescentCb_${++state.callbackId}_${Date.now().toString(36)}`;
          const params = new URLSearchParams({action,callback});
          if (state.token) params.set('token', state.token);
          Object.entries(payload).forEach(([key,value]) => {
            if (value !== undefined && value !== null) params.set(key, String(value));
          });
          const script = document.createElement('script');
          let settled = false;
          const timer = window.setTimeout(() => finish(null), 18000);
          function finish(data) {
            if (settled) return;
            settled = true;
            window.clearTimeout(timer);
            delete window[callback];
            script.remove();
            resolve(data);
          }
          window[callback] = finish;
          script.onerror = () => finish(null);
          script.src = `${API_URL}?${params.toString()}`;
          document.head.appendChild(script);
        }).then(result => result || ({ok:false,message:'The server did not respond. Please try again.'}));
      }
      function guardAuth(result) {
        if (result && result.authError) { logout(true); return true; }
        return false;
      }
      function fmtDate(value, options={}) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '—';
        return date.toLocaleString(undefined, options.month ? options : {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
      }
      function fmtTime(value) {
        if (!value) return '—';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? '—' : date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
      }
      function localInputValue(date) {
        const pad = n => String(n).padStart(2,'0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }
      function formatDurationMinutes(value) {
        const minutes = Math.max(0,Math.round(value));
        const hours = Math.floor(minutes/60), rest = minutes%60;
        return [hours ? `${hours} hour${hours===1?'':'s'}` : '',rest ? `${rest} minute${rest===1?'':'s'}` : ''].filter(Boolean).join(' ') || '0 minutes';
      }
      function overdueInfo(movement) {
        if (!movement || movement.status !== 'Approved' || !movement.expectedReturn) return null;
        const due = new Date(movement.expectedReturn).getTime(), diff = Date.now()-due;
        if (!Number.isFinite(due) || diff <= 0) return null;
        const s = Math.floor(diff/1000), days=Math.floor(s/86400),hours=Math.floor(s%86400/3600),mins=Math.floor(s%3600/60),secs=s%60;
        const pad = n => String(n).padStart(2,'0');
        return {level:diff>10800000?'crit':'warn',label:`${days}d ${pad(hours)}h ${pad(mins)}m ${pad(secs)}s`,due};
      }
      function isLate(m) {
        return !!(m && m.status==='Completed' && m.timeIn && m.expectedReturn && new Date(m.timeIn)>new Date(m.expectedReturn));
      }
      function badge(status) {
        const allowed = ['Pending','Approved','Completed','Rejected','Active','Inactive'];
        const key = allowed.includes(status) ? status : 'Pending';
        return `<span class="badge status-${key}">${escapeHtml(status || 'Unknown')}</span>`;
      }
      function roleBadge(role) {
        const key = ['admin','staff','student','gatekeeper'].includes(role) ? role : 'student';
        return `<span class="badge role-${key}">${escapeHtml(role || 'student')}</span>`;
      }
      function categoryBadge(value) { return `<span class="badge category">${escapeHtml(value || 'Other')}</span>`; }
      function initials(name) { return String(name||'?').trim().split(/\s+/).slice(0,2).map(part=>part.charAt(0)).join('').toUpperCase(); }
      function navForUser() { return NAV[state.user && NAV[state.user.role] ? state.user.role : 'staff']; }
      function countPending() { return Number(state.stats.pending) || state.movements.filter(m=>m.status==='Pending').length; }
      function countOverdue() { return state.movements.filter(overdueInfo).length; }
      function titleForTab(tab) { return (navForUser().find(item=>item[0]===tab)||[])[1] || CAMPUS; }

      function render() {
        stopGateScanner();
        applyTheme();
        app.innerHTML = state.view === 'login' ? renderLogin() : renderShell();
        renderPassQr();
        renderModal();
        setOnline();
        if (state.view==='app' && state.tab==='log') initDurationForm();
      }
      function renderPassQr() {
        const image=$('#studentPassQr');
        if(!image||!state.current||state.current.status!=='Approved'||!state.current.passCode)return;
        const codeLabel=$('#studentPassCode');
        if(codeLabel)codeLabel.textContent=state.current.passCode;
        const code=qrcode(0,'M');
        code.addData(state.current.passCode);
        code.make();
        image.src=code.createDataURL(7,4);
      }
      async function copyPassCode() {
        if(!state.current||state.current.status!=='Approved'||!state.current.passCode)return;
        if(!navigator.clipboard||!navigator.clipboard.writeText){
          toast('Copy is unavailable here. Select the manual code or show the QR to gate staff.','error');
          return;
        }
        try{
          await navigator.clipboard.writeText(state.current.passCode);
          toast('Pass code copied. Share it only with gate staff.','success');
        }catch(error){
          toast(error&&error.message?`Could not copy the pass code: ${error.message}`:'Could not copy the pass code.','error');
        }
      }
      function renderLogin() {
        return `<main class="login-page">
          <div class="login-shell">
            <section class="login-art" aria-label="Campus movement register">
              <div class="brand-lockup"><img class="brand-mark brand-logo" src="https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png" alt="SNEC logo"><div><small>Campus register</small><strong>${CAMPUS}</strong></div></div>
              <div class="login-copy"><span class="eyebrow">A considered campus</span><h1>Every journey,<br>accounted for.</h1><p>A clear, reliable record of campus movements, approvals and returns — thoughtfully organized for students and staff.</p></div>
              <div class="login-points"><div><strong>One ledger</strong><span>Every movement in one place</span></div><div><strong>Live status</strong><span>Returns and approvals at a glance</span></div></div>
            </section>
            <section class="login-form-side">
              <form class="login-form" data-form="login" novalidate>
                <span class="eyebrow">Welcome back</span><h2>Sign in</h2><p>Use your campus account to continue.</p>
                ${state.error ? `<div class="alert-error" role="alert">${escapeHtml(state.error)}</div>` : ''}
                <div class="field"><label for="loginId">Campus ID</label><input id="loginId" name="id" class="mono" autocomplete="username" placeholder="Enter your campus ID" required></div>
                <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
                <button class="btn btn-primary btn-block" type="submit" ${state.loading?'disabled':''}>${state.loading?'<span class="spinner"></span> Signing in':'Sign in to register'}</button>
                <p class="login-help">Use the credentials provided by your campus office. Contact your campus administrator if you need help accessing your account.</p>
                <div class="login-tools"><div class="login-tools-actions">${installButtonMarkup('btn btn-soft btn-sm')}<button class="btn btn-quiet btn-sm" type="button" data-action="theme">${state.theme==='dark'?'☼ Switch to light':'◐ Switch to dark'} mode</button></div></div>
              </form>
            </section>
          </div>
        </main>`;
      }
      function renderShell() {
        const user = state.user;
        const nav = navForUser();
        const navMarkup = items => items.map(([id,label,icon])=>`<button type="button" class="nav-item ${state.tab===id?'active':''}" data-action="tab" data-tab="${id}" ${state.tab===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span>${id==='approvals'&&countPending()?`<span class="nav-count">${countPending()}</span>`:''}${id==='board'&&countOverdue()?`<span class="nav-count">${countOverdue()}</span>`:''}</button>`).join('');
        return `<div class="app">
          <aside class="sidebar">
            <div class="side-brand"><img class="brand-mark brand-logo" src="https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png" alt=""><div><strong>${CAMPUS}</strong><small>Movement register</small></div></div>
            <div class="nav-caption">${user.role==='student'?'Student portal':user.role==='gatekeeper'?'Gatekeeper station':'Workspace'}</div>
            <nav class="nav" aria-label="Main navigation">${navMarkup(nav)}</nav>
            <div class="side-spacer"></div>
            <div class="side-bottom">
              <div class="user-chip"><div class="avatar" aria-hidden="true">${escapeHtml(initials(user.name))}</div><div class="user-chip-copy"><strong>${escapeHtml(user.name)}</strong><small>${escapeHtml(user.id)} · ${escapeHtml(user.role)}</small></div></div>
              <div class="side-controls"><button class="btn btn-quiet btn-sm" type="button" data-action="theme">${state.theme==='dark'?'☼ Light':'◐ Dark'} mode</button><button class="btn btn-quiet btn-sm" type="button" data-action="logout">Sign out</button></div>
              ${installButtonMarkup('btn btn-soft btn-sm install-sidebar')}
              ${user.role==='admin'?'<a class="developer-credit" href="https://wa.me/917306814004" target="_blank" rel="noopener noreferrer" aria-label="Contact ImDevops on WhatsApp">ImDevops</a>':''}
            </div>
          </aside>
          <main class="main">
            <header class="topbar"><div class="topbar-left"><img class="brand-mark brand-logo" src="https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png" alt="" aria-hidden="true" style="width:34px;height:34px;border-radius:10px"><div class="topbar-title">${escapeHtml(titleForTab(state.tab))}</div></div><div class="topbar-right"><span class="live-indicator">${navigator.onLine?'Connected':'Offline'}</span><button class="icon-btn" type="button" data-action="refresh" aria-label="Refresh data">↻</button><button class="icon-btn" type="button" data-action="theme" aria-label="Toggle color theme">${state.theme==='dark'?'☼':'◐'}</button><button class="icon-btn" type="button" data-action="logout" aria-label="Sign out">↗</button></div></header>
            <div class="content" id="content">${state.dataLoading?renderSkeleton():renderTab()}</div>
          </main>
          <nav class="mobile-nav" aria-label="Mobile navigation">${navMarkup(nav.filter(x=>['overview','log','approvals','board','status','history','gate'].includes(x[0])).slice(0,5))}<button type="button" class="nav-item ${['ledger','users','analytics','profile'].includes(state.tab)?'active':''}" data-action="more"><span class="nav-icon">···</span><span>More</span></button></nav>
        </div>`;
      }
      function renderSkeleton() { return `<div class="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="height:220px"></div></div>`; }
      function installButtonMarkup(className='btn btn-soft btn-sm') {
        return isAppInstalled()?'':`<button class="${className}" type="button" data-action="install"><img class="install-icon" src="https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png" alt="" aria-hidden="true"><span>Install app</span></button>`;
      }
      function isAppInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
      }
      function installInstructions() {
        const ua=navigator.userAgent;
        if(/iPhone|iPad|iPod/i.test(ua))return ['Open this page in Safari.','Tap the Share button.','Choose “Add to Home Screen”, then tap Add.'];
        if(/Android/i.test(ua))return ['Open this page in Chrome.','Tap the ⋮ menu.','Choose “Install app” or “Add to Home screen”.'];
        return ['Open this page in Chrome or Microsoft Edge.','Select the install icon in the address bar, or open the browser menu.','Choose “Install Crescent SNEC”.'];
      }
      async function installApp() {
        if(isAppInstalled()){toast('Crescent SNEC is already installed.');return}
        if(!state.installPrompt){state.modal={kind:'install-help'};renderModal();return}
        const prompt=state.installPrompt;
        state.installPrompt=null;
        await prompt.prompt();
        const choice=await prompt.userChoice;
        if(choice.outcome==='accepted')toast('Crescent SNEC is being installed.','success');
      }
      function pageHead(title, description, actions='') {
        return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`;
      }
      function statCard(label,value,detail,icon,kind='') {
        return `<article class="card stat ${kind}"><div class="stat-mark" aria-hidden="true">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${escapeHtml(value)}</div><div class="stat-foot">${detail}</div></article>`;
      }
      function renderOverview() {
        const stats=state.stats||{}, pending=state.movements.filter(m=>m.status==='Pending'), out=state.movements.filter(m=>m.status==='Approved'), overdue=out.filter(overdueInfo);
        const recent=state.movements.slice(0,6);

            <div class="gate-scan-grid">

      function stopGateScanner() {

      async function requestCameraAccess() {
        // Must run directly from the tap so mobile browsers show the permission prompt.
        const attempts=[{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];
        let lastError=null;
        for(const constraints of attempts){
          try{
            const stream=await navigator.mediaDevices.getUserMedia(constraints);
            stream.getTracks().forEach(track=>track.stop());
            return null;
          }catch(error){
            lastError=error;
            if(error&&(error.name==='NotAllowedError'||error.name==='SecurityError'||error.name==='NotFoundError'||error.name==='NotReadableError'))break;
          }
        }
        return lastError;
      }
      function cameraErrorMessage(error) {
        const name=error&&error.name||'';
        const embedded=window.self!==window.top;
        if(!window.isSecureContext)return 'Camera needs a secure HTTPS address. Open the https:// link of this app.';
        if(name==='NotAllowedError'||name==='SecurityError'){
          if(embedded)return 'Camera is blocked because this page is embedded inside another page. Open the app link directly in Chrome or Safari.';
          const ua=navigator.userAgent;
          if(/iPhone|iPad|iPod/i.test(ua))return 'Camera is blocked. Go to Settings › Safari › Camera (or Settings › the installed app) and choose Allow, then reload.';
          return 'Camera is blocked. Tap the lock icon in the address bar › Permissions › Camera › Allow (or Android Settings › Apps › Chrome › Permissions › Camera), then reload.';
        }
        if(name==='NotFoundError'||name==='OverconstrainedError')return 'No camera was found on this device.';
        if(name==='NotReadableError'||name==='AbortError')return 'The camera is in use by another app. Close it and try again.';
        return 'Camera could not start. Enter the pass code manually.';
      }
      async function startGateScanner() {
        const video=$('#gateScannerVideo'),hint=$('#gateCameraHint'),status=$('#gateScanStatus');
        if(!video||!status)return;
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
          status.textContent=window.isSecureContext?'Camera scanning is not available in this browser. Enter the pass code manually.':'Camera needs a secure HTTPS address. Open the https:// link of this app.';
          return;
        }
        if(typeof QrScanner==='undefined'){
          status.textContent='The QR scanner could not be loaded. Check your connection and reload, or enter the pass code manually.';
          return;
        }
        status.textContent='Requesting camera access…';
        const accessError=await requestCameraAccess();
        if(accessError){
          const message=cameraErrorMessage(accessError);
          if(hint){hint.hidden=false;hint.textContent=message}
          status.textContent=message;
          toast(message,'error');
          return;
        }
        if(!state.gateScanner){
          state.gateScanner=new QrScanner(video,result=>{
            if(state.gateLookupLoading)return;
            state.gateScanner.pause();
            lookupGatePass(result.data);
          },{returnDetailedScanResult:true,preferredCamera:'environment',maxScansPerSecond:10,onDecodeError:()=>{}});
        }
        try{
          video.setAttribute('playsinline','');video.muted=true;
          video.style.display='block';
          if(hint)hint.hidden=true;
          await state.gateScanner.start();
          state.gateScannerActive=true;
          status.textContent='Camera ready. Hold the student’s QR code inside the frame.';

          if(start)start.hidden=true;
          if(stop)stop.hidden=false;
        }catch(error){
          stopGateScanner();
          video.style.display='none';
          const message=cameraErrorMessage(typeof error==='string'?{name:/denied|permission/i.test(error)?'NotAllowedError':'Error'}:error);
          if(hint){hint.hidden=false;hint.textContent=message}
          status.textContent=message;
          toast(message,'error');
        }

      async function lookupGatePass(value) {
        if(state.gateLookupLoading)return;
        pauseGateScanner();
        const passCode=String(value||'').trim().replace(/^crescent-snec-pass:/i,'').trim();
        state.gatePass=null;state.gatePassCode='';state.gatePassError='';state.gateScanMessage='';
        const status=$('#gateScanStatus');
        if(!/^[a-f0-9]{64}$/i.test(passCode)){
          state.gatePassError='This does not look like a valid campus pass code.';
          if(status)status.textContent='Pass code format not recognized.';
          renderGateScanResultInPlace();
          return;
        }
        state.gateLookupLoading=true;
        if(status)status.textContent='Checking the pass with the campus register…';
        renderGateScanResultInPlace();
        try{
          const result=await api('gateLookupPass',{passCode});
          if(guardAuth(result))return;
          if(!result.ok){
            state.gatePassError=result.message||'This pass could not be verified.';
            if(status)status.textContent='Pass not verified.';
            return;
          }
          state.gatePass=result.pass;
          state.gatePassCode=passCode;
          if(status)status.textContent='Pass verified. Check the student’s identity and confirm the gate action.';
        }finally{
          state.gateLookupLoading=false;
          renderGateScanResultInPlace();
        }

      function renderLog() {
        return `${pageHead('Log a movement','Create a gate pass and set a clear expected return window.')}

      function renderTab() {
        if(!state.user)return '';

      function renderContent(restoreFilter='') {
        const root=$('#content');
        if(!root)return;
        stopGateScanner();
        root.innerHTML=state.dataLoading?renderSkeleton():renderTab();
        if(state.tab==='log')initDurationForm();
        if(restoreFilter){
          const input=$(`[data-filter="${restoreFilter}"]`,root);

      function initDurationForm() {
        const form=$('[data-form="movement"]');
        if(!form)return;
        const startField=$('[name="departureAt"]',form),endField=$('[name="returnAt"]',form);
        if(!form.dataset.startMs){
          const start=new Date();start.setSeconds(0,0);form.dataset.startMs=String(start.getTime());
        }
        const startMs=Number(form.dataset.startMs);
        if(!startField.value)startField.value=localInputValue(new Date(startMs));
        endField.min=localInputValue(new Date(startMs));
        if(!endField.value)endField.value=localInputValue(new Date(startMs+120*60000));
        updateDurationUI(form);
      }
      function updateDurationUI(form,minutes) {
        if(!form)return;
        if(Number.isFinite(minutes)){
          form.dataset.durationMode='preset';
          form.dataset.durationMinutes=String(minutes);
        }
        const startMs=Number(form.dataset.startMs)||Date.now();
        const startField=$('[name="departureAt"]',form),endField=$('[name="returnAt"]',form),hidden=$('[name="expectedDuration"]',form);
        const start=new Date(startMs);
        if(startField&&!startField.value)startField.value=localInputValue(start);
        endField.min=localInputValue(start);
        if(Number.isFinite(minutes))endField.value=localInputValue(new Date(startMs+minutes*60000));
        const returnAt=endField.value?new Date(endField.value):null;
        const duration=returnAt&&!Number.isNaN(returnAt.getTime())?(returnAt.getTime()-startMs)/60000:0;
        const valid=Number.isInteger(duration)&&duration>=1;
        hidden.value=valid?String(duration/60):'';
        const selected=$$('.duration-option',form);
        selected.forEach(button=>{
          const preset=Number(button.dataset.minutes);
          const isSelected=button.hasAttribute('data-minutes')?stateDurationMode(form)!=='custom'&&preset===duration:stateDurationMode(form)==='custom';
          button.setAttribute('aria-pressed',String(isSelected));
        });
        const message=$('[data-duration-message]',form),preview=$('[data-duration-preview]',form),submit=$('[type="submit"]',form);
        preview.setAttribute('aria-invalid',String(!valid));
        if(!valid)message.textContent='Choose a return time after departure.';
        else message.textContent=`Planned return ${returnAt.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${formatDurationMinutes(duration)} after departure`;
        submit.disabled=!valid||state.loading;
      }
      function stateDurationMode(form) { return form.dataset.durationMode||'preset'; }

      async function loadData({silent=false}={}) {
        if(!state.user||state.user.role==='student')return loadStudentData({silent});
        if(state.user.role==='gatekeeper')return loadGateData({silent});
        if(state.dataLoading)return;
        if(!silent&&!state.movements.length){state.dataLoading=true;renderContent();}
        const result=await api('getInitialData');
        if(guardAuth(result))return;
        state.dataLoading=false;
        if(!result.ok){if(!state.movements.length)renderContent();toast(result.message||'Could not load register data.','error');return}
        state.movements=Array.isArray(result.movements)?result.movements:[];
        state.users=Array.isArray(result.users)?result.users:[];
        state.stats=result.stats||{};
        render();
      }
      async function loadGateData({silent=false}={}) {
        if(!state.user||state.user.role!=='gatekeeper'||state.dataLoading)return;
        if(!silent&&!state.movements.length){state.dataLoading=true;renderContent();}
        const result=await api('getGateDesk');
        if(guardAuth(result))return;
        state.dataLoading=false;
        if(!result.ok){if(!state.movements.length)renderContent();toast(result.message||'Could not load active gate passes.','error');return}
        state.movements=Array.isArray(result.movements)?result.movements:[];
        render();
      }
      async function loadStudentData({silent=false}={}) {
        if(!state.user)return;
        if(!silent){state.dataLoading=true;renderContent();}
        const [status,history]=await Promise.all([api('getMyStatus'),api('getMyHistory')]);
        if(guardAuth(status)||guardAuth(history))return;
        state.dataLoading=false;
        if(!status.ok||!history.ok){renderContent();toast(status.message||history.message||'Could not load your pass information.','error');return}
        state.current=status.current||null;state.strikes=Number(status.strikes)||0;
        state.history=Array.isArray(history.movements)?history.movements:[];state.historyStrikes=Number(history.strikes)||0;
        render();
      }
      async function loadAnalytics() {
        const result=await api('getAnalytics');
        if(guardAuth(result))return;
        if(!result.ok){toast(result.message||'Could not load analytics.','error');return}
        state.analytics=result.analytics||{};
        renderContent();
      }
      async function refreshAfterMutation({users=false,analytics=false}={}) {
        const result=await api('getInitialData');
        if(guardAuth(result))return;
        if(!result.ok){toast(result.message||'Saved, but the latest data could not be refreshed.','error');return}
        state.movements=result.movements||[];state.stats=result.stats||{};
        if(users)state.users=result.users||[];
        if(analytics)state.analytics=null;
        render();
        if(analytics&&state.tab==='analytics')await loadAnalytics();

      function switchTab(tab) {
        if(!navForUser().some(item=>item[0]===tab))return;
        state.tab=tab;state.page=1;state.filters={q:'',status:'All',category:'All',role:'All'};
        if(tab==='analytics'&&!state.analytics)render();

        if(tab==='analytics')loadAnalytics();
        if(tab==='history'&&state.user.role==='student'&&!state.history.length)loadStudentData();
        if(tab==='gate'&&state.user.role==='gatekeeper')loadGateData({silent:true});
        window.scrollTo({top:0,behavior:'smooth'});
      }
      async function login(form) {
        const id=String(new FormData(form).get('id')||'').trim(),password=String(new FormData(form).get('password')||'');
        if(!id||!password){state.error='Enter your campus ID and password.';render();return}
        state.loading=true;state.error='';render();
        const result=await api('login',{id,password});
        state.loading=false;
        if(!result.ok){state.error=result.message||'Unable to sign in.';render();return}
        state.token=result.token;state.user=result.user;state.view='app';state.tab=result.user.role==='student'?'status':result.user.role==='gatekeeper'?'gate':'overview';saveSession();render();
        if(state.user.role==='student')await loadStudentData();else if(state.user.role==='gatekeeper')await loadGateData();else await loadData();
        startTimers();
      }
      async function logout(silent=false) {
        stopGateScanner();
        const token=state.token;
        if(token&&!silent)await api('logout');
        state.token='';state.user=null;state.view='login';state.movements=[];state.users=[];state.stats={};state.history=[];state.current=null;state.analytics=null;state.loading=false;state.dataLoading=false;
        state.gatePass=null;state.gatePassCode='';state.gatePassError='';state.gateScanMessage='';state.gateLookupLoading=false;
        clearInterval(state.refreshTimer);clearInterval(state.ageTimer);saveSession();render();
        if(silent)toast('Your session expired. Please sign in again.','error');
      }
      async function createMovement(form) {
        const fd=new FormData(form),studentId=String(fd.get('studentId')||'').trim(),studentName=String(fd.get('studentName')||'').trim();
        const destination=String(fd.get('destination')||'').trim(),reason=String(fd.get('reason')||'').trim();
        const departure=new Date();departure.setSeconds(0,0);form.dataset.startMs=String(departure.getTime());$('[name="departureAt"]',form).value=localInputValue(departure);
        if(stateDurationMode(form)==='preset'){
          const presetMinutes=Number(form.dataset.durationMinutes)||120;
          $('[name="returnAt"]',form).value=localInputValue(new Date(departure.getTime()+presetMinutes*60000));
        }
        updateDurationUI(form);
        const expectedDuration=Number($('[name="expectedDuration"]',form).value);
        if(!studentName||!destination||!reason){toast('Add the student name, destination and reason.','error');return}
        if(!Number.isFinite(expectedDuration)||expectedDuration<=0){toast('Choose a return time after departure.','error');return}
        state.loading=true;updateDurationUI(form);
        const submit=$('[type="submit"]',form);submit.innerHTML='<span class="spinner"></span> Creating pass';
        const result=await api('logMovement',{studentId,studentName,destination,reason,category:fd.get('category'),expectedDuration,autoApprove:fd.get('autoApprove')?'1':'0'});
        state.loading=false;
        if(!result.ok){toast(result.message||'Could not create movement pass.','error');renderContent();return}
        toast(result.movement&&result.movement.status==='Approved'?'Movement approved and logged.':'Request sent to approvals.', 'success');
        switchTab(result.movement&&result.movement.status==='Approved'?'board':'approvals');
        await refreshAfterMutation();
      }
      function openDecision(id,decision) {

      async function submitDecision(form) {

      async function submitReturn(form) {
        const fd=new FormData(form),button=$('[type="submit"]',form);
        button.disabled=true;button.innerHTML='<span class="spinner"></span> Recording';
        const result=await api('markReturn',{movementId:fd.get('movementId'),lateReason:String(fd.get('lateReason')||'').trim()});

        if(result.requiresLateReason){
          state.modal={kind:'late-return',data:{movementId:fd.get('movementId'),...state.modal.data}};
          renderModal();return;

        if(!result.ok){button.disabled=false;toast(result.message||'Could not record return.','error');return}

      async function submitGateAction(form) {
        const fd=new FormData(form),action=String(form.dataset.gateAction),button=$('[type="submit"]',form);
        button.disabled=true;button.innerHTML='<span class="spinner"></span> Recording';
        const result=await api(action==='exit'?'gateConfirmExit':'gateConfirmReturn',{passCode:fd.get('passCode'),lateReason:String(fd.get('lateReason')||'').trim()});
        if(guardAuth(result))return;
        if(result.requiresLateReason){
          state.modal={kind:'gate-return-late',data:{...state.modal.data,passCode:fd.get('passCode')}};
          renderModal();return;
        }
        if(!result.ok){button.disabled=false;button.textContent=action==='exit'?'Confirm exit':'Confirm return';toast(result.message||'Could not update the gate record.','error');return}
        state.modal=null;renderModal();toast(action==='exit'?'Exit verified and recorded.':'Return verified and recorded.','success');
        clearGateScan(action==='exit'?'Exit recorded. Scan the same pass QR again when the student returns.':'Return recorded. This pass is complete.');
        await refreshGateDeskPreservingScanner();
        if(state.gateScanner)await startGateScanner();
      }
      function renderModal() {
        if(!state.modal){modalHost.innerHTML='';return}
        const {kind,data={}}=state.modal;
        let body='';
        if(kind==='decision'){
          const isApprove=data.decision==='Approve';
          body=`<h2>${isApprove?'Approve this pass?':'Decline this request?'}</h2><p class="modal-intro">${escapeHtml(data.name)} · ${escapeHtml(data.destination||'No destination')}</p>
            <form data-form="decision"><input type="hidden" name="movementId" value="${escapeHtml(data.movementId)}"><input type="hidden" name="decision" value="${data.decision}">
              <div class="field"><label for="decisionRemarks">Staff remarks <span class="muted">(optional)</span></label><textarea id="decisionRemarks" name="remarks" placeholder="Add a note for the register"></textarea></div>
              <div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn ${isApprove?'btn-primary':'btn-danger'}" type="submit">${isApprove?'Approve pass':'Decline request'}</button></div></form>`;
        }else if(kind==='return'||kind==='late-return'){
          const late=kind==='late-return';
          body=`<h2>${late?'Record a late return':'Mark student returned?'}</h2><p class="modal-intro">${escapeHtml(data.name)} · ${escapeHtml(data.destination||'No destination')}${late?`<br>Overdue by ${escapeHtml(data.lateBy||'')}`:''}</p>
            <form data-form="return"><input type="hidden" name="movementId" value="${escapeHtml(data.movementId)}">${late?`<div class="field"><label for="lateReason">Reason for late return</label><textarea id="lateReason" name="lateReason" required placeholder="Record the reason before closing this pass"></textarea></div>`:''}
              <div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn ${late?'btn-danger':'btn-primary'}" type="submit">${late?'Record reason & return':'Confirm return'}</button></div></form>`;
        }else if(kind==='gate-exit'||kind==='gate-return'||kind==='gate-return-late'){
          const exiting=kind==='gate-exit',late=kind==='gate-return-late';
          body=`<h2>${exiting?'Verify student exit?':late?'Record a late gate return':'Verify student return?'}</h2><p class="modal-intro"><strong>${escapeHtml(data.name||'Student')}</strong> · ${escapeHtml(data.destination||'No destination')}<br>Pass ${escapeHtml(data.movementId||'')}${late?'<br>This pass is past its expected return time.':''}</p>
            <form data-form="gate-action" data-gate-action="${exiting?'exit':'return'}"><input type="hidden" name="passCode" value="${escapeHtml(data.passCode||'')}">${late?`<div class="field"><label for="gateLateReason">Reason for late return</label><textarea id="gateLateReason" name="lateReason" required placeholder="Record the reason before closing this pass"></textarea></div>`:''}
              <div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn ${late?'btn-danger':'btn-primary'}" type="submit">${exiting?'Confirm exit':late?'Record reason & return':'Confirm return'}</button></div></form>`;
        }else if(kind==='user'){
          const editing=!!data.id,admin=state.user.role==='admin';
          const roles=['student','staff','gatekeeper',...(admin?['admin']:[])];
          body=`<h2>${editing?'Edit person':'Add a person'}</h2><p class="modal-intro">${editing?'Update the campus directory entry.':'Create a campus directory or staff account.'}</p>
            <form data-form="user"><input type="hidden" name="editing" value="${editing?'1':''}"><input type="hidden" name="id" value="${escapeHtml(data.id||'')}">
              <div class="form-grid"><div class="field"><label for="userId">Campus ID</label><input id="userId" name="newId" ${editing?'disabled':''} value="${escapeHtml(data.id||'')}" required></div><div class="field"><label for="userRole">Role</label><select id="userRole" name="role">${roles.map(r=>`<option ${data.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
              <div class="field span-2"><label for="userName">Full name</label><input id="userName" name="name" value="${escapeHtml(data.name||'')}" required></div>
              <div class="field"><label for="userClass">Class / department</label><input id="userClass" name="className" value="${escapeHtml(data.class||'')}"></div><div class="field"><label for="userPhone">Phone</label><input id="userPhone" name="phone" type="tel" value="${escapeHtml(data.phone||'')}"></div>
              <div class="field span-2"><label for="userPassword">${editing?'New password (optional)':'Password'}</label><input id="userPassword" name="password" type="password" autocomplete="new-password"><span class="field-hint">Required for staff, gatekeeper and admin accounts. Leave blank to keep an existing password.</span></div></div>
              <div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${editing?'Save changes':'Add person'}</button></div></form>`;
        }else if(kind==='delete-user'){
          body=`<h2>Remove this person?</h2><p class="modal-intro">This will permanently remove <strong>${escapeHtml(data.name||data.id)}</strong> (${escapeHtml(data.id)}) from the directory. This cannot be undone.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-delete" data-id="${escapeHtml(data.id)}">Remove person</button></div>`;
        }else if(kind==='more'){
          body=`<h2>More workspace</h2><p class="modal-intro">Choose a section to open.</p><div class="nav">${navForUser().filter(x=>!['overview','log','approvals','board','status','history'].includes(x[0])).map(([id,label,icon])=>`<button class="nav-item" data-action="tab-close" data-tab="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}<button class="nav-item" data-action="theme-close"><span class="nav-icon">◐</span>Switch theme</button><button class="nav-item" data-action="logout"><span class="nav-icon">↗</span>Sign out</button></div>${installButtonMarkup('btn btn-soft btn-block more-install')}${state.user.role==='admin'?'<a class="developer-credit" href="https://wa.me/917306814004" target="_blank" rel="noopener noreferrer" aria-label="Contact ImDevops on WhatsApp">ImDevops</a>':''}`;
        }else if(kind==='install-help'){
          body=`<div class="install-dialog-brand"><img class="install-dialog-icon" src="https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png" alt=""><div><h2>Install Crescent SNEC</h2><p class="modal-intro">Add the campus register to your device for quick access.</p></div></div><ol class="install-instructions">${installInstructions().map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol><p class="install-note">For installation, open this app from its secure campus web address in a supported browser. “Add to Home Screen” adds a shortcut on browsers that don’t offer automatic installation.</p><div class="modal-actions"><button class="btn btn-primary" type="button" data-action="close-modal">Got it</button></div>`;
        }
        modalHost.innerHTML=`<div class="modal-layer" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading"><button class="modal-close" type="button" data-action="close-modal" aria-label="Close dialog">×</button><div id="modalContent">${body}</div></section></div>`;
        const heading=$('#modalContent h2');if(heading)heading.id='modalHeading';
        const first=$('#modalContent input:not([type=hidden]):not(:disabled),#modalContent textarea,#modalContent select');if(first)setTimeout(()=>first.focus(),30);
      }
      async function saveUser(form) {
        const fd=new FormData(form),editing=fd.get('editing')==='1',role=String(fd.get('role')),password=String(fd.get('password')||'');
        const id=editing?String(fd.get('id')):String(fd.get('newId')||'').trim();
        if(!id||!String(fd.get('name')||'').trim()){toast('Campus ID and name are required.','error');return}
        if(!editing&&['staff','admin','gatekeeper'].includes(role)&&!password){toast('Staff, gatekeeper and admin accounts need a password.','error');return}
        const button=$('[type="submit"]',form);button.disabled=true;button.innerHTML='<span class="spinner"></span> Saving';
        const payload={id,name:String(fd.get('name')).trim(),role,className:String(fd.get('className')||'').trim(),phone:String(fd.get('phone')||'').trim(),password};
        const result=await api(editing?'updateUser':'addUser',payload);
        if(guardAuth(result))return;
        if(!result.ok){button.disabled=false;button.textContent=editing?'Save changes':'Add person';toast(result.message||'Could not save person.','error');return}
        state.modal=null;renderModal();toast(editing?'Person updated.':'Person added.','success');await refreshAfterMutation({users:true});
      }
      async function deleteUser(id,button) {
        button.disabled=true;button.textContent='Removing';
        const result=await api('deleteUser',{id});
        if(guardAuth(result))return;
        if(!result.ok){button.disabled=false;button.textContent='Remove person';toast(result.message||'Could not remove person.','error');return}
        state.modal=null;renderModal();toast('Person removed.','success');await refreshAfterMutation({users:true});
      }
      async function changePassword(form) {
        const fd=new FormData(form),newPassword=String(fd.get('newPassword')||'');
        if(newPassword.length<4){toast('New password must be at least 4 characters.','error');return}
        const button=$('[type="submit"]',form);button.disabled=true;button.innerHTML='<span class="spinner"></span> Updating';
        const result=await api('changePassword',{oldPassword:fd.get('oldPassword'),newPassword});
        if(guardAuth(result))return;
        if(!result.ok){button.disabled=false;button.textContent='Update password';toast(result.message||'Could not update password.','error');return}
        form.reset();button.disabled=false;button.textContent='Update password';toast('Password updated successfully.','success');
      }
      function exportCsv() {
        const rows=filteredMovements(state.movements);
        if(!rows.length){toast('There are no matching records to export.','error');return}
        const headers=[['MovementID','movementId'],['UserID','userId'],['Name','name'],['Role','role'],['Class','class'],['Category','category'],['Reason','reason'],['Destination','destination'],['TimeOut','timeOut'],['ExpectedReturn','expectedReturn'],['GateOutAt','gateOutAt'],['GateOutBy','gateOutBy'],['GateInAt','gateInAt'],['GateInBy','gateInBy'],['TimeIn','timeIn'],['Status','status'],['ApprovedBy','approvedBy'],['Remarks','remarks'],['LateReason','lateReason'],['LoggedBy','loggedBy']];
        const cell=value=>{let text=String(value??'');if(/^[\u0000-\u0020]*[=+\-@]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`};
        const csv='\uFEFF'+[headers.map(([label])=>cell(label)).join(','),...rows.map(m=>headers.map(([,key])=>cell(m[key])).join(','))].join('\r\n');
        const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');
        link.href=url;link.download=`crescent-movement-ledger-${new Date().toISOString().slice(0,10)}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
        toast(`Exported ${rows.length} filtered record${rows.length===1?'':'s'}.`,'success');
      }
      function startTimers() {
        clearInterval(state.refreshTimer);clearInterval(state.ageTimer);
        state.refreshTimer=setInterval(()=>{if(state.view==='app'&&navigator.onLine){if(state.user.role==='student')loadStudentData({silent:true});else if(state.user.role==='gatekeeper'){if(!state.gateScannerActive&&!state.gatePassCode)loadGateData({silent:true})}else loadData({silent:true})}},30000);
        state.ageTimer=setInterval(()=>{
          $$('[data-overdue]').forEach(node=>{
            const due=Number(node.dataset.overdue),diff=Date.now()-due;
            if(diff<=0)return;
            const s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60,pad=n=>String(n).padStart(2,'0');
            node.textContent=`${d}d ${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
          });
        },1000);
      }
      function resetFilters() {state.filters={q:'',status:'All',category:'All',role:'All'};state.page=1;renderContent()}

      document.addEventListener('click',async event=>{
        const button=event.target.closest('[data-action]');if(!button)return;
        const action=button.dataset.action;
        if(action==='tab'||action==='tab-close'){state.modal=null;renderModal();switchTab(button.dataset.tab)}
        else if(action==='more'){state.modal={kind:'more'};renderModal()}
        else if(action==='theme'||action==='theme-close'){state.theme=state.theme==='dark'?'light':'dark';applyTheme();if(action==='theme-close')state.modal=null;render()}
        else if(action==='logout')await logout();
        else if(action==='install')await installApp();
        else if(action==='refresh'){if(state.user.role==='student')await loadStudentData();else if(state.user.role==='gatekeeper')await loadGateData();else await loadData()}
        else if(action==='clearFilters')resetFilters();
        else if(action==='page'){const page=Number(button.dataset.page);if(Number.isInteger(page)&&page>0){state.page=page;renderContent()}}
        else if(action==='preset'){const form=button.closest('[data-form="movement"]');if(form){form.dataset.durationMode='preset';updateDurationUI(form,Number(button.dataset.minutes))}}
        else if(action==='preset-custom'){const form=button.closest('[data-form="movement"]');if(form){form.dataset.durationMode='custom';$('[name="returnAt"]',form).focus();updateDurationUI(form)}}
        else if(action==='decision')openDecision(button.dataset.id,button.dataset.decision);
        else if(action==='return')openReturn(button.dataset.id);
        else if(action==='scan-start')await startGateScanner();
        else if(action==='scan-stop'){pauseGateScanner();const status=$('#gateScanStatus');if(status)status.textContent='Camera stopped. Enter a pass code or start the camera again.'}
        else if(action==='gate-scan-confirm')openGateScanAction();
        else if(action==='gate-scan-clear')clearGateScan();
        else if(action==='copy-pass-code')await copyPassCode();
        else if(action==='close-modal'){state.modal=null;renderModal()}
        else if(action==='backdrop'&&event.target===button){state.modal=null;renderModal()}
        else if(action==='add-user'){state.modal={kind:'user',data:{}};renderModal()}
        else if(action==='edit-user'){const user=state.users.find(u=>u.id===button.dataset.id);if(user){state.modal={kind:'user',data:user};renderModal()}}
        else if(action==='delete-user'){const user=state.users.find(u=>u.id===button.dataset.id);state.modal={kind:'delete-user',data:user||{id:button.dataset.id}};renderModal()}
        else if(action==='confirm-delete')await deleteUser(button.dataset.id,button);
        else if(action==='export')exportCsv();
        else if(action==='analytics-refresh'){state.analytics=null;await loadAnalytics()}
        else if(action==='print')window.print();
      });
      document.addEventListener('input',event=>{
        const target=event.target;
        if(target.matches('[name="returnAt"]')){const form=target.closest('[data-form="movement"]');if(form){form.dataset.durationMode='custom';updateDurationUI(form)}return}
        if(target.matches('[data-student-lookup]')){
          const id=target.value.trim(),match=state.users.find(u=>u.role==='student'&&String(u.id).toLowerCase()===id.toLowerCase()),name=$('[data-student-name]'),hint=$('#studentHint');
          if(match){name.value=match.name;name.dataset.autofilled='1';hint.textContent=`Matched ${match.name}${match.class?` · ${match.class}`:''}`;hint.style.color='var(--green)'}
          else{if(name.dataset.autofilled==='1')name.value='';name.dataset.autofilled='';hint.textContent=id?'No matching student ID. You may enter a name manually.':'';hint.style.color='var(--gold)'}
          return;
        }
        if(target.matches('[data-filter]')){
          const key=target.dataset.filter;state.filters[key]=target.value;state.page=1;
          clearTimeout(state._filterTimer);state._filterTimer=setTimeout(()=>renderContent(key),target.tagName==='SELECT'?0:180);
        }
      });
      document.addEventListener('submit',async event=>{
        const form=event.target.closest('[data-form]');if(!form)return;
        event.preventDefault();
        if(form.dataset.form==='login')await login(form);
        else if(form.dataset.form==='movement')await createMovement(form);
        else if(form.dataset.form==='scan-pass'){const code=new FormData(form).get('passCode');form.reset();await lookupGatePass(code)}
        else if(form.dataset.form==='decision')await submitDecision(form);
        else if(form.dataset.form==='return')await submitReturn(form);
        else if(form.dataset.form==='gate-action')await submitGateAction(form);
        else if(form.dataset.form==='user')await saveUser(form);
        else if(form.dataset.form==='password')await changePassword(form);
      });
      document.addEventListener('keydown',event=>{
        if(event.key==='Escape'&&state.modal){state.modal=null;renderModal()}
      });
      window.addEventListener('online',()=>{setOnline();toast('Connection restored.','success');if(state.view==='app'){if(state.user.role==='student')loadStudentData({silent:true});else if(state.user.role==='gatekeeper')loadGateData({silent:true});else loadData({silent:true})}});
      window.addEventListener('offline',()=>{setOnline();toast('You are offline.','error')});
      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();state.installPrompt=event});
      window.addEventListener('appinstalled',()=>{state.installPrompt=null;$$('[data-action="install"]').forEach(button=>button.remove());toast('Crescent SNEC was installed.','success')});
      applyTheme();loadSession();render();setOnline();
      if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
        navigator.serviceWorker.register('./service-worker.js').catch(error=>console.warn('App installation support could not register its offline shell.',error));
      }
      if(state.view==='app'){if(state.user.role==='student')loadStudentData();else if(state.user.role==='gatekeeper')loadGateData();else loadData();startTimers()}

      // ---- PWA: inline manifest + icons generated from the logo ----
      (function () {
        const LOGO = 'https://i.postimg.cc/dQNpbgBh/SNEC-Logo-(2).png';
        const base = location.href.split('#')[0].split('?')[0];
        function icon(img, size, pad) {
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const x = c.getContext('2d');
          x.fillStyle = '#ffffff';
          x.fillRect(0, 0, size, size);
          const inner = size * (1 - 2 * pad);
          const r = Math.min(inner / img.naturalWidth, inner / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
          return c.toDataURL('image/png');
        }
        function attach(icons) {
          const manifest = {
            id: base, name: 'Crescent SNEC · Movement Register', short_name: 'Crescent SNEC',
            description: 'Crescent SNEC campus movement register',
            start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
            background_color: '#f4f3ec', theme_color: '#244b5a', icons
          };
          const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
          let link = document.querySelector('link[rel="manifest"]');
          if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
          link.href = url;
        }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const i192 = icon(img, 192, .08), i512 = icon(img, 512, .08), iMask = icon(img, 512, .2);
            const apple = document.querySelector('link[rel="apple-touch-icon"]');
            if (apple) apple.href = icon(img, 180, .08);
            attach([
              { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
              { src: iMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]);
          } catch (e) { attach([{ src: LOGO, sizes: '512x512', type: 'image/png' }]); }
        };
        img.onerror = () => attach([{ src: LOGO, sizes: '512x512', type: 'image/png' }]);
        img.src = LOGO;
      })();
    })();
  </script>
</body>
