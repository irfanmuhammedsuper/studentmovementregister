    // ─── Chart Initialization ──────────────────────────────────────────
    async function initAnalyticsCharts() {
      if (!window.Chart) {
        try { await ensureChartJs(); } catch (e) { toast('Analytics chart library could not be loaded.', 'error'); return; }
      }
      for (const key in state.charts) {
        if (state.charts[key]) state.charts[key].destroy();
      }
      state.charts = {};

      const a = state.analytics || {};
      const isDark = state.theme === 'dark';
      const fontColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#181310';
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || 'rgba(24,19,16,.14)';
      const greenC = getComputedStyle(document.documentElement).getPropertyValue('--green').trim() || '#2F7D5B';
      const redC = getComputedStyle(document.documentElement).getPropertyValue('--red').trim() || '#B23A2E';
      const maroonC = getComputedStyle(document.documentElement).getPropertyValue('--maroon').trim() || '#7A1F2B';
      const goldC = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#B8842E';

      const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: fontColor, font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: fontColor }, grid: { color: gridColor } },
          y: { ticks: { color: fontColor }, grid: { color: gridColor } }
        }
      };

      // 1. Role doughnut
      const roleData = a.roleDist || [];
      const doughnutCtx = document.getElementById('roleDoughnut');
      if (doughnutCtx) {
        state.charts.roleDoughnut = new Chart(doughnutCtx, {
          type: 'doughnut',
          data: {
            labels: roleData.map(r => r.role),
            datasets: [{ data: roleData.map(r => r.count), backgroundColor: ['#7A1F2B', '#B8842E', '#2F7D5B', '#B23A2E'].slice(0, roleData.length), borderColor: isDark ? '#211C18' : '#FFFDF8', borderWidth: 2 }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: fontColor, font: { size: 11 } } } } }
        });
      }

      // 2. Daily activity bar
      const dailyData = a.dailyActivity || [];
      const dailyCtx = document.getElementById('dailyBar');
      if (dailyCtx) {
        state.charts.dailyBar = new Chart(dailyCtx, {
          type: 'bar',
          data: { labels: dailyData.map(d => d.date.slice(5)), datasets: [{ label: 'Movements', data: dailyData.map(d => d.count), backgroundColor: maroonC, borderColor: maroonC, borderWidth: 1 }] },
          options: { ...commonOptions, plugins: { ...commonOptions.plugins, legend: { display: false } } }
        });
      }

      // 3. Top destinations
      const destData = a.topDestinations || [];
      const destCtx = document.getElementById('destBar');
      if (destCtx) {
        state.charts.destBar = new Chart(destCtx, {
          type: 'bar',
          data: { labels: destData.map(d => d.destination).slice(0, 5), datasets: [{ label: 'Visits', data: destData.map(d => d.count).slice(0, 5), backgroundColor: goldC, borderColor: goldC, borderWidth: 1 }] },
          options: { ...commonOptions, indexAxis: 'y', plugins: { ...commonOptions.plugins, legend: { display: false } } }
        });
      }

      // 4. Movement status
      const statuses = ['Pending', 'Approved', 'Completed', 'Rejected'];
      const statusCounts = statuses.map(s => state.movements.filter(m => m.status === s).length);
      const statusCtx = document.getElementById('statusBar');
      if (statusCtx) {
        state.charts.statusBar = new Chart(statusCtx, {
          type: 'bar',
          data: { labels: statuses, datasets: [{ label: 'Count', data: statusCounts, backgroundColor: [goldC, greenC, greenC, redC], borderColor: [goldC, greenC, greenC, redC], borderWidth: 1 }] },
          options: { ...commonOptions, plugins: { ...commonOptions.plugins, legend: { display: false } } }
        });
      }

      // 5. Overdue Risk by Reason — stacked bar (on-time vs late)
      const overdueCat = a.overdueByCategory || [];
      const overdueCtx = document.getElementById('overdueCategoryBar');
      if (overdueCtx) {
        state.charts.overdueCategoryBar = new Chart(overdueCtx, {
          type: 'bar',
          data: {
            labels: overdueCat.map(c => c.category),
            datasets: [
              { label: 'On time', data: overdueCat.map(c => c.onTime), backgroundColor: greenC, stack: 's' },
              { label: 'Late', data: overdueCat.map(c => c.late), backgroundColor: redC, stack: 's' },
            ]
          },
          options: { ...commonOptions, scales: { x: { ...commonOptions.scales.x, stacked: true }, y: { ...commonOptions.scales.y, stacked: true, beginAtZero: true } } }
        });
      }

      // 6. Approval Funnel — 100% stacked bar
      const funnel = a.approvalFunnel || [];
      const funnelPct = funnel.map(c => {
        const total = c.approved + c.rejected;
        return { category: c.category, approvedPct: total ? Math.round((c.approved / total) * 100) : 0, rejectedPct: total ? Math.round((c.rejected / total) * 100) : 0 };
      });
      const funnelCtx = document.getElementById('approvalFunnelBar');
      if (funnelCtx) {
        state.charts.approvalFunnelBar = new Chart(funnelCtx, {
          type: 'bar',
          data: {
            labels: funnelPct.map(c => c.category),
            datasets: [
              { label: 'Approved %', data: funnelPct.map(c => c.approvedPct), backgroundColor: greenC, stack: 's' },
              { label: 'Rejected %', data: funnelPct.map(c => c.rejectedPct), backgroundColor: redC, stack: 's' },
            ]
          },
          options: { ...commonOptions, indexAxis: 'y', scales: { x: { ...commonOptions.scales.x, stacked: true, max: 100 }, y: { ...commonOptions.scales.y, stacked: true } } }
        });
      }

      // 7. Reason Frequency — multi-line
      const rf = a.reasonFrequency || { dates: [], series: [] };
      const rfCtx = document.getElementById('reasonFrequencyLine');
      if (rfCtx) {
        state.charts.reasonFrequencyLine = new Chart(rfCtx, {
          type: 'line',
          data: {
            labels: (rf.dates || []).map(d => d.slice(5)),
            datasets: (rf.series || []).map((s, i) => ({
              label: s.category,
              data: s.counts,
              borderColor: CATEGORY_COLORS[i % CATEGORY_COLORS.length],
              backgroundColor: CATEGORY_COLORS[i % CATEGORY_COLORS.length],
              tension: .3,
              pointRadius: 2,
              borderWidth: 2,
              fill: false,
            }))
          },
          options: { ...commonOptions, plugins: { legend: { labels: { color: fontColor, font: { size: 10 } } } } }
        });
      }

      // 8. Average Duration by Category — polar area
      const avgDur = a.avgDurationByCategory || [];
      const polarCtx = document.getElementById('avgDurationPolar');
      if (polarCtx) {
        state.charts.avgDurationPolar = new Chart(polarCtx, {
          type: 'polarArea',
          data: { labels: avgDur.map(c => c.category), datasets: [{ data: avgDur.map(c => c.avgHours), backgroundColor: CATEGORY_COLORS.map(c => c + 'b3') }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: fontColor, font: { size: 10 } } } },
            scales: { r: { ticks: { color: fontColor, backdropColor: 'transparent' }, grid: { color: gridColor }, angleLines: { color: gridColor } } }
          }
        });
      }

      // 9. Weekly activity
      const weekly = a.weeklyActivity || [];
      const weeklyCtx = document.getElementById('weeklyBar');
      if (weeklyCtx) {
        state.charts.weeklyBar = new Chart(weeklyCtx, {
          type: 'bar',
          data: { labels: weekly.map(w => w.week.slice(5)), datasets: [{ label: 'Movements', data: weekly.map(w => w.count), backgroundColor: maroonC, borderColor: maroonC, borderWidth: 1 }] },
          options: { ...commonOptions, plugins: { ...commonOptions.plugins, legend: { display: false } } }
        });
      }

      // 10. Monthly activity
      const monthly = a.monthlyActivity || [];
      const monthlyCtx = document.getElementById('monthlyBar');
      if (monthlyCtx) {
        state.charts.monthlyBar = new Chart(monthlyCtx, {
          type: 'bar',
          data: { labels: monthly.map(m => m.month.slice(5)), datasets: [{ label: 'Movements', data: monthly.map(m => m.count), backgroundColor: goldC, borderColor: goldC, borderWidth: 1 }] },
          options: { ...commonOptions, plugins: { ...commonOptions.plugins, legend: { display: false } } }
        });
      }
    }

    // ─── PDF Report Generation ─────────────────────────────────────────
    async function generatePDFReport() {
      const content = document.getElementById('analytics-report-content');
      if (!content) { toast('Analytics data not loaded.', 'error'); return; }

      const btn = document.querySelector('[data-action="generatePDFReport"]');
      const origHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spin"></span> Generating PDF…`;

      try {
        await ensurePdfLibs();
        const canvas = await html2canvas(content, {
          scale: 2, useCORS: true,
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#FFFDF8',
          logging: false, allowTaint: false
        });

        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        let heightLeft = pdfHeight;
        let position = 0;
        pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
        heightLeft -= pdf.internal.pageSize.getHeight();
        while (heightLeft > 0) {
          position = heightLeft - pdfHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
          heightLeft -= pdf.internal.pageSize.getHeight();
        }

        pdf.save('Crescent_SNEC_Analytics_Report.pdf');

        btn.innerHTML = origHtml;

    // ─── MODALS ──────────────────────────────────────────────────────────

<p class="hint" id="studentRoleHint" style="margin:-.4rem 0 1rem;${role==='student'?'':'display:none;'}">Students who need the portal must have a password. Staff/admin accounts always require a password.</p>

          <h3 style="margin-bottom:.3rem;">Late Return</h3>

          <div class="modal-warn-strip"><span>⏰</span><span>This pass is overdue${d.lateBy?(' ('+esc(d.lateBy)+')'):''}. A reason is required before it can be marked in.</span></div>

            <input type="hidden" name="movementId" value="${esc(d.movementId)}" />

              <button type="button" class="btn btn-ghost" style="flex:1" data-action="closeModal">Cancel</button>

          <button type="button" class="modal-close" data-action="closeModal" aria-label="Close">✕</button>

          <div style="display:flex;flex-direction:column;gap:.3rem;">
            ${nav.filter(n=>!currentMobilePrimary().includes(n.id)).map(n=>`<div class="nav-item ${state.tab===n.id?'active':''}" data-action="setTabAndClose" data-tab="${n.id}"><span>${n.ico}</span>${n.label}${navBadge(n)}</div>`).join('')}
            <div class="nav-item" data-action="toggleThemeClose"><span>${state.theme==='dark'?'☀':'●'}</span>${state.theme==='dark'?'Light mode':'Dark mode'}</div>

        modalBox.addEventListener('click', e => e.stopPropagation());
      }

      if (firstInput) setTimeout(() => firstInput.focus(), 50);

    window.toggleUserPasswordField = function(selectEl) {
      const label = document.getElementById('userPasswordLabel');
      const hint = document.getElementById('studentRoleHint');
      if (!label) return;
      const isStaff = selectEl.value === 'staff' || selectEl.value === 'admin';
      const form = selectEl.closest('form');
      const editing = form && form.dataset.form === 'updateUser';
      label.textContent = editing
        ? (isStaff ? 'New password (optional)' : 'New portal password (optional)')
        : (isStaff ? 'Password' : 'Portal password (optional)');
      if (hint) hint.style.display = isStaff ? 'none' : '';
    };

    // ─── DATA LOADING ──────────────────────────────────────────────────
    // Initial load fetches the shared datasets once. Tab navigation never
    // reloads the entire database; mutations perform targeted refreshes.
    let initialLoadPromise = null;

    // Backward-compatible alias used by boot/reconnect flows.
    function loadInitialData(options = {}) { return loadAll(options); }

    async function loadAll(options = {}) {
      const force = !!options.force;
      const showSkeleton = !state.movements.length && !state.users.length && Object.keys(state.stats || {}).length === 0;

      if (initialLoadPromise) return initialLoadPromise;

      if (state.user && state.user.role === 'student') {
        if (showSkeleton) { state.tabLoading = true; refreshTabContent(true); }
        const p = (async () => {
          const res = await api('getMyStatus', {});
          if (res.authError) return doLogout(true);
          state.tabLoading = false;
          if (!res.ok) { refreshTabContent(); toast(res.message || 'Could not refresh your status.', 'error'); return; }
          state.myStatus = res.current || null;
          state.myStrikes = res.strikes || 0;
          refreshTabContent(true);
          if (state.tab === 'history') await loadStudentHistory();
        })();
        initialLoadPromise = p.finally(() => { initialLoadPromise = null; });
        return initialLoadPromise;
      }

      if (showSkeleton) { state.tabLoading = true; refreshTabContent(true); }
      const p = (async () => {
        const res = await api('getInitialData', {});
        if (res.authError) return doLogout(true);
        if (!res.ok) {
          state.tabLoading = false;
          refreshTabContent();
          toast(res.message || 'Could not refresh data — check your connection.', 'error');
          return;
        }
        state.movements = res.movements || [];
        state.stats = res.stats || {};
        state.users = res.users || [];
        state.tabLoading = false;
        refreshTabContent(true);
      })();
      initialLoadPromise = p.finally(() => { initialLoadPromise = null; });
      return initialLoadPromise;
    }

    async function refreshAfterMutation({users = false, analytics = false} = {}) {
      // Refresh only the datasets that can have changed. Movement/stat changes
      // are common; user and analytics data are refreshed only when necessary.
      const res = await api('getInitialData', {});
      if (res.authError) return doLogout(true);
      if (!res.ok) { toast(res.message || 'Could not refresh data.', 'error'); return; }
      state.movements = res.movements || state.movements;
      state.stats = res.stats || state.stats;
      state.users = res.users || state.users;
      if (analytics && state.tab === 'analytics' && state.user && state.user.role === 'admin') {
        const an = await api('getAnalytics', {});
        if (an.ok) state.analytics = an.analytics || {};
      }
      refreshTabContent(true);
    }

    async function loadStudentHistory() {
      if (!state.user || state.user.role !== 'student') return;
      const res = await api('getMyHistory', {});
      if (res.authError) return doLogout(true);
      if (!res.ok) { toast(res.message || 'Could not load your history.', 'error'); return; }
      state.studentHistory = res.movements || [];
      state.studentHistoryStrikes = res.strikes || 0;
      if (state.tab === 'history') refreshTabContent(true);
    }

    async function loadAnalytics(force = false) {
      if (!state.user || state.user.role !== 'admin') return;
      if (state.analytics && !force) {
        refreshTabContent(true);
        return;
      }
      const an = await api('getAnalytics', {});
      if (an.authError) return doLogout(true);
      if (an.ok) { state.analytics = an.analytics || {}; refreshTabContent(true); }
      else toast(an.message || 'Could not load analytics.', 'error');
    }

    // ─── Button busy helper ────────────────────────────────────────────
    function setBtnBusy(btn, busy, busyText) {
      if (!btn) return;
      if (busy) {
        btn.dataset.origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spin"></span> ${busyText || 'Working…'}`;
      } else if (btn.dataset.origHtml) {
        btn.innerHTML = btn.dataset.origHtml;
        btn.disabled = false;
        delete btn.dataset.origHtml;
      }
    }

    // ─── ACTIONS ──────────────────────────────────────────────────────
    async function doLogin(form) {
      state.gateError = '';
      state.loading = true;
      render();
      const id = (form.get('id') || '').trim(), password = form.get('password') || '';
      if (!id || !password) { state.loading = false; state.gateError = 'Enter both your ID and password.'; render(); return; }
      const res = await api('login', { id, password });
      state.loading = false;
      if (!res.ok) { state.gateError = res.message || 'Login failed.'; render(); return; }
      state.token = res.token;
      state.user = res.user;
      state.view = 'app';
      state.tab = res.user.role === 'student' ? 'status' : 'overview';
      saveSession();
      render();
      doneOverlay('welcome', res.user.name.split(' ')[0], 1200);
      loadInitialData();
      startOverdueTicker();
    }

    async function doLogout(silent) {
      if (!silent && state.token) await api('logout', {});
      state.token = null;
      state.user = null;
      state.view = 'gate';
      state.movements = [];
      state.users = [];
      state.stats = {};
      state.analytics = null;
      state.studentHistory = [];
      state.studentHistoryStrikes = 0;
      state.myStrikes = 0;
      state.gateError = '';
      clearInterval(state._overdueTick);
      saveSession();
      render();
      if (silent) toast('Session expired — please sign in again.', 'error');
    }

    async function doLogMovement(form, formEl) {
      const studentId = (form.get('studentId') || '').trim(), studentName = (form.get('studentName') || '').trim();
      const destination = (form.get('destination') || '').trim(), reason = (form.get('reason') || '').trim();
      const category = form.get('category') || 'Other';
      const expectedDuration = form.get('expectedDuration') || DEFAULT_EXPECTED_HOURS;
      if (!studentName || !destination || !reason) { toast('Please fill in student name, destination and reason.', 'error'); return; }
      const autoApprove = form.get('autoApprove') ? '1' : '0';
      state.loading = true;
      refreshTabContent(true);
      const res = await api('logMovement', { studentId, studentName, destination, reason, category, expectedDuration, autoApprove });
      state.loading = false;
      if (!res.ok) { toast(res.message || 'Could not log movement.', 'error'); refreshTabContent(true); return; }
      const approved = res.movement && res.movement.status === 'Approved';
      doneOverlay(approved ? 'out' : 'pending', (res.movement && res.movement.name) || destination);
      state.tab = approved ? 'board' : 'approvals';
      await refreshAfterMutation();
    }

    // Central overdue-aware "Mark In" entry point used by pass cards & ledger rows.
    function handleMarkReturnClick(id, btn) {
      const mv = state.movements.find(x => x.movementId === id)
        || (state.myStatus && state.myStatus.movementId === id ? state.myStatus : null);
      const info = mv ? overdueInfo(mv) : null;
      if (info) {
        openModal('lateReturn', { movementId: id, name: mv.name, destination: mv.destination, lateBy: info.label });
      } else {
        doMarkReturn(id, btn);
      }
    }

    async function doMarkReturn(id, btn, lateReason) {
      setBtnBusy(btn, true, '');
      const res = await api('markReturn', { movementId: id, lateReason: lateReason || '' });
      if (res.requiresLateReason) {
        setBtnBusy(btn, false);
        const meta = findMovementMeta(id);
        openModal('lateReturn', { movementId: id, ...meta });
        return;
      }
      if (!res.ok) { setBtnBusy(btn, false); toast(res.message || 'Could not mark return.', 'error'); return; }
      doneOverlay('in');
      await refreshAfterMutation();
    }

    async function doSubmitLateReturn(form, formEl) {
      const movementId = form.get('movementId');
      const lateReason = (form.get('lateReason') || '').trim();
      if (!lateReason) { toast('Please provide a reason for the late return.', 'error'); return; }
      const submitBtn = formEl ? formEl.querySelector('button[type=submit]') : null;
      setBtnBusy(submitBtn, true, 'Marking in…');
      const res = await api('markReturn', { movementId, lateReason });
      if (!res.ok) { setBtnBusy(submitBtn, false); toast(res.message || 'Could not mark return.', 'error'); return; }
      closeModal();
      doneOverlay('in', 'Late reason recorded');
      await refreshAfterMutation();
    }

    async function doApproveReject(form, formEl) {
      const decision = form.get('decision');
      const submitBtn = formEl ? formEl.querySelector('button[type=submit]') : null;
      setBtnBusy(submitBtn, true, decision === 'Reject' ? 'Rejecting…' : 'Approving…');
      const res = await api('approveMovement', { movementId: form.get('movementId'), decision, remarks: form.get('remarks') });
      if (!res.ok) { setBtnBusy(submitBtn, false); toast(res.message || 'Action failed.', 'error'); return; }
      closeModal();
      doneOverlay(decision === 'Reject' ? 'reject' : 'approve');
      await refreshAfterMutation();
    }

    async function doChangePassword(form, formEl) {
      const oldPw = form.get('oldPassword') || '', newPw = form.get('newPassword') || '';
      if (newPw.length < 4) { toast('New password must be at least 4 characters.', 'error'); return; }
      state.loading = true;
      refreshTabContent(true);
      const res = await api('changePassword', { oldPassword: oldPw, newPassword: newPw });
      state.loading = false;
      if (!res.ok) { toast(res.message || 'Could not update password.', 'error'); refreshTabContent(true); return; }
      doneOverlay('ok', 'Password changed');
      refreshTabContent(true);
    }

    async function doAddUser(form, formEl) {
      if (state.savingUser) return;
      const role = form.get('role');
      const id = (form.get('visId') || '').trim(), name = (form.get('name') || '').trim();
      if (!id || !name) { toast('User ID and name are required.', 'error'); return; }
      if ((role === 'staff' || role === 'admin') && !form.get('password')) { toast('Staff and admin accounts need a password.', 'error'); return; }

      const submitBtn = formEl ? formEl.querySelector('button[type=submit]') : null;
      const cancelBtn = formEl ? formEl.querySelector('[data-action="closeModal"]') : null;
      state.savingUser = true;
      setBtnBusy(submitBtn, true, 'Adding…');
      if (cancelBtn) cancelBtn.disabled = true;

      try {
        // Keep the Add User modal open until the backend confirms success.
        const res = await api('addUser', {
          id,
          name,
          role,
          className: form.get('class'),
          phone: form.get('phone'),
          password: form.get('password')
        });

        if (!res.ok) {
          setBtnBusy(submitBtn, false);
          if (cancelBtn) cancelBtn.disabled = false;
          toast(res.message || 'Could not add user.', 'error');
          return;
        }

        closeModal();
        doneOverlay('ok', id);
        await refreshAfterMutation({users:true});
      } catch (err) {
        setBtnBusy(submitBtn, false);
        if (cancelBtn) cancelBtn.disabled = false;
        toast('Could not add user. Please try again.', 'error');
      } finally {
        state.savingUser = false;
      }
    }

    async function doUpdateUser(form, formEl) {
      const submitBtn = formEl ? formEl.querySelector('button[type=submit]') : null;
      setBtnBusy(submitBtn, true, 'Saving…');
      const res = await api('updateUser', { id: form.get('id'), name: form.get('name'), role: form.get('role'), className: form.get('class'), phone: form.get('phone'), password: form.get('password') });
      if (!res.ok) { setBtnBusy(submitBtn, false); toast(res.message || 'Could not update user.', 'error'); return; }
      closeModal();
      doneOverlay('ok', form.get('id'));
      await refreshAfterMutation({users:true});
    }

    function doDeleteUser(id) { openModal('confirmDelete', { id }); }

    async function confirmDeleteUser(id, btn) {
      setBtnBusy(btn, true, 'Removing…');
      const res = await api('deleteUser', { id });
      if (!res.ok) { setBtnBusy(btn, false); toast(res.message || 'Could not remove user.', 'error'); return; }
      closeModal();
      toast('User removed.', 'success');
      await refreshAfterMutation({users:true});
    }

    function exportCsv() {
      const rows = filterRows(state.movements);
      if (!rows.length) { toast('Nothing to export for the current filters.', 'error'); return; }
      const headers = ['MovementID', 'UserID', 'Name', 'Role', 'Class', 'Category', 'Reason', 'Destination', 'TimeOut', 'ExpectedReturn', 'TimeIn', 'Status', 'ApprovedBy', 'Remarks', 'LateReason', 'LoggedBy'];
      const csv = [headers.join(',')].concat(rows.map(m => headers.map(h => {
        const key = h.charAt(0).toLowerCase() + h.slice(1);
        let v = m[key] ?? '';
        v = String(v).replace(/"/g, '""');
        return /[,"\n]/.test(v) ? `"${v}"` : v;
      }).join(','))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'csnec-movement-ledger-' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('CSV exported.', 'success');
    }

    function findMovementMeta(id) { const m = state.movements.find(x => x.movementId === id); return m ? { name: m.name, destination: m.destination } : {}; }

    // ─── EVENT DELEGATION ──────────────────────────────────────────────
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-action]');
      if (!t) {
        if (e.target.classList && e.target.classList.contains('modal-backdrop')) closeModal();
        return;
      }
      const action = t.dataset.action;
      switch (action) {
        case 'toggleTheme':
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', state.theme);
          saveSettings();
          render();
          break;
        case 'toggleShowPw':
          state.showPw = !state.showPw;
          render();
          break;
        case 'backdropClose': closeModal(); break;
        case 'closeModal': closeModal(); break;
        case 'clearFilters':
          state.filters = { status: 'All', q: '', role: state.filters.role || 'All', category: 'All' };
          refreshTabContent();
          break;
        case 'setTab':
          if (state.tab === t.dataset.tab) break;
          state.tab = t.dataset.tab;
          state.filters = { status: 'All', q: '', role: 'All', category: 'All' };
          render();
          if (state.tab === 'analytics' && state.user && state.user.role === 'admin') loadAnalytics();
          break;
        case 'setTabAndClose':
          state.tab = t.dataset.tab;
          state.filters = { status: 'All', q: '', role: 'All', category: 'All' };
          closeModal();
          render();
          if (state.tab === 'analytics' && state.user && state.user.role === 'admin') loadAnalytics();
          break;
        case 'toggleThemeClose':
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', state.theme);
          saveSettings();
          closeModal();
          render();
          break;
        case 'logoutClose':
          closeModal();
          doLogout();
          break;
        case 'openMoreSheet': openModal('more', {}); break;
        case 'logout': doLogout(); break;
        case 'markReturn': handleMarkReturnClick(t.dataset.id, t); break;
        case 'approve': openModal('approveReject', { movementId: t.dataset.id, decision: 'Approve', ...findMovementMeta(t.dataset.id) }); break;
        case 'reject': openModal('approveReject', { movementId: t.dataset.id, decision: 'Reject', ...findMovementMeta(t.dataset.id) }); break;
        case 'openAddUser': openModal('addUser', {}); break;
        case 'openEditUser': { const u = state.users.find(x => x.id === t.dataset.id); openModal('editUser', u || {}); break; }
        case 'deleteUser': doDeleteUser(t.dataset.id); break;
        case 'confirmDeleteUser': confirmDeleteUser(t.dataset.id, t); break;
        case 'exportCsv': exportCsv(); break;
        case 'refreshAnalytics': loadAnalytics(true); break;
        case 'generatePDFReport': generatePDFReport(); break;
      }
    });

    document.addEventListener('input', (e) => {
      // Inputs inside an open modal must not trigger page refreshes.
      if (e.target.closest('#modalHost .modal')) return;
      if (e.target.dataset.filter) {
        state.filters[e.target.dataset.filter] = e.target.value;
        clearTimeout(state._debounce);
        state._debounce = setTimeout(refreshTabContentPreserveFocus, e.target.tagName === 'SELECT' ? 0 : 180);
        return;
      }
      if (e.target.dataset.lookup === 'studentId') {
        const id = e.target.value.trim();
        const nameField = document.querySelector('[data-lookup-target="studentName"]');
        const hint = document.getElementById('studentMatchHint');
        if (!hint) return;
        const match = id ? state.users.find(u => u.role === 'student' && String(u.id).toLowerCase() === id.toLowerCase()) : null;
        if (id && match) {
          hint.textContent = '✓ Matched: ' + match.name + (match.class ? ' · ' + match.class : '');
          hint.style.color = 'var(--green)';
          if (nameField) { nameField.value = match.name; nameField.dataset.auto = '1'; }
        } else if (id) {
          hint.textContent = 'No student found with this ID — you can still enter their name manually.';
          hint.style.color = 'var(--gold)';
          if (nameField && nameField.dataset.auto === '1') { nameField.value = ''; nameField.dataset.auto = ''; }
        } else {
          hint.textContent = '';
          if (nameField && nameField.dataset.auto === '1') { nameField.value = ''; nameField.dataset.auto = ''; }
        }
      }
    });

    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('[data-form]');
      if (!form) return;
      e.preventDefault();
      const fd = new FormData(form);
      const kind = form.dataset.form;
      if (kind === 'login') return doLogin(fd);
      if (kind === 'logMovement') return doLogMovement(fd, form);
      if (kind === 'changePassword') return doChangePassword(fd, form);
      if (kind === 'addUser') return doAddUser(fd, form);
      if (kind === 'updateUser') return doUpdateUser(fd, form);
      if (kind === 'doApproveReject') return doApproveReject(fd, form);
      if (kind === 'submitLateReturn') return doSubmitLateReturn(fd, form);
    });

    // ─── BOOT ──────────────────────────────────────────────────────────
    render();
    updateOnlineStatus();
    if (state.view === 'app' && state.user) { loadAll({force:true}); startOverdueTicker(); }
  </script>
</body>
</html>
